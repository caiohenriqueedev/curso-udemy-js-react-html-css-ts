<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexbox</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- 1 - flex -->
    <div class="flex">
      <p>meu</p>
      <p>primeiro</p>
      <p>elemento</p>
      <p>com flex</p>
    </div>

    <!-- 2 - column -->
    <div class="flex-column">
      <span>1</span>
      <span>2</span>
      <span>3</span>
      <p>4</p>
    </div>

    <!-- 3 - wrap -->
    <div class="wrap">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <!-- 4 -  justify content -->
    <h2>center</h2>
    <div class="center">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <h2>space around</h2>
    <div class="space-around">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <h2>space between</h2>
    <div class="space-between">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <h2>end</h2>
    <div class="end">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <!-- 5 -align items -->
    <h2>center</h2>
    <div class="align-center">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <h2>end</h2>
    <div class="flex-end">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <h2>stretch</h2>
    <div class="stretch">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <!-- 6 -gap -->
     <h2>gap</h2>
    <div class="gap">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <!-- 7 - order -->
    <h2>order</h2>
    <div class="order">
      <div class="box" id="three">3</div>
      <div class="box" id="one">1</div>
      <div class="box" id="two">2</div>
    </div>

    <!-- 8 - grow -->
    <h2>grow</h2>
    <div class="grow">
      <div class="box"></div>
      <div class="big box"></div>
      <div class="box"></div>
    </div>

    <!-- 9 - basis -->
    <h2>basis</h2>
    <div class="basis">
      <div class="box"></div>
      <div class="big box"></div>
      <div class="box"></div>
    </div>

    <!-- 10 - shrink -->
    <h2>shrink</h2>
    <div class="shrink">
      <div class="box"></div>
      <div class="small box"></div>
      <div class="box"></div>
    </div>

    <!-- 11 - flex shorthand -->
    <h2>shorthand</h2>
    <div class="shorthand">
      <div class="box"></div>
      <div class="different box"></div>
      <div class="box"></div>
    </div>

    <!-- 12 - auto alinhamento -->
    <h2>auto alinhamento</h2>
    <div class="auto-alignment">
      <div class="box"></div>
      <div class="different box"></div>
      <div class="box"></div>
    </div>
  </body>
</html>
